name: Android debug APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/android-debug.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate required OAuth and Apps Script configuration
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        shell: bash
        run: |
          echo "## BUDOWA GROUP — configuration check" >> "$GITHUB_STEP_SUMMARY"
          invalid=0
          if [[ -z "$GOOGLE_WEB_CLIENT_ID" ]]; then
            echo "::error::Missing GOOGLE_WEB_CLIENT_ID GitHub Actions secret"
            invalid=1
          elif [[ "$GOOGLE_WEB_CLIENT_ID" != *.apps.googleusercontent.com ]]; then
            echo "::error::Invalid GOOGLE_WEB_CLIENT_ID format"
            invalid=1
          fi
          if [[ -z "$APPS_SCRIPT_URL" ]]; then
            echo "::error::Missing APPS_SCRIPT_URL GitHub Actions secret"
            invalid=1
          elif [[ "$APPS_SCRIPT_URL" != https://script.google.com/macros/s/*/exec ]]; then
            echo "::error::Invalid APPS_SCRIPT_URL format"
            invalid=1
          fi
          if (( invalid )); then
            echo "❌ BLOCKED: Required OAuth/API configuration is missing or invalid. No APK will be built." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✅ Required configuration is present and correctly formatted (runtime functionality still requires testing)." >> "$GITHUB_STEP_SUMMARY"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android scaffold
        run: flutter create --platforms=android --project-name budowa_group --org group.budowa .
      - name: Remove incompatible generated template files
        run: |
          rm -f test/widget_test.dart
          rm -f analysis_options.yaml
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Build test-only debug APK
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: |
          flutter build apk --debug \
            --dart-define="GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID" \
            --dart-define="APPS_SCRIPT_URL=$APPS_SCRIPT_URL"
      - name: Inspect APK and extract signing SHA-1
        shell: bash
        run: |
          APK=build/app/outputs/flutter-apk/app-debug.apk
          test -s "$APK"
          echo "### APK compilation succeeded (runtime login not verified)" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK size: $(du -h "$APK" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "⚠️ CI debug signing is ephemeral. Do not register this SHA-1 as a permanent Android OAuth certificate." >> "$GITHUB_STEP_SUMMARY"
          if [[ -f "$HOME/.android/debug.keystore" ]]; then
            keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android | grep 'SHA1:' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "SHA-1 not available: debug keystore not found" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: budowa-group-test-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
      - name: Report failure
        if: failure()
        run: |
          echo "### Build failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Open the failed step in the build job to see the exact error." >> "$GITHUB_STEP_SUMMARY"
