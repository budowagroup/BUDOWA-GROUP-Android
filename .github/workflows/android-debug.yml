name: Android debug APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/android-debug.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - name: Generate Android scaffold
        run: flutter create --platforms=android --project-name budowa_group --org group.budowa .
      - name: Remove incompatible generated template files
        run: |
          rm -f test/widget_test.dart
          rm -f analysis_options.yaml
      - name: Verify supplied brand images
        run: |
          test -s assets/images/ic_launcher.png
          test -s assets/images/splash_screen.webp
          test -s assets/images/background.webp
      - name: Install dependencies
        run: flutter pub get
      - name: Generate Android launcher icon
        run: dart run flutter_launcher_icons
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Restore and verify stable Android debug signing key
        shell: bash
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          ANDROID_DEBUG_SHA1: ${{ secrets.ANDROID_DEBUG_SHA1 }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" || -z "$ANDROID_DEBUG_SHA1" ]]; then
            echo "::error::Missing ANDROID_DEBUG_KEYSTORE_BASE64 or ANDROID_DEBUG_SHA1. Stable Android OAuth signing is required."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          chmod 700 "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          actual="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android | sed -n 's/^[[:space:]]*SHA1: //p' | head -n 1)"
          if [[ -z "$actual" || "${actual^^}" != "${ANDROID_DEBUG_SHA1^^}" ]]; then
            echo "::error::Android debug keystore SHA-1 does not match ANDROID_DEBUG_SHA1."
            exit 1
          fi
          echo "Stable Android signing certificate SHA-1 verified (fingerprint withheld)." >> "$GITHUB_STEP_SUMMARY"
      - name: Validate required OAuth and Apps Script configuration
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        shell: bash
        run: |
          echo "## BUDOWA GROUP — configuration check" >> "$GITHUB_STEP_SUMMARY"
          invalid=0
          if [[ -z "$GOOGLE_WEB_CLIENT_ID" ]]; then
            echo "::error::Missing GOOGLE_WEB_CLIENT_ID GitHub Actions secret"
            invalid=1
          elif [[ "$GOOGLE_WEB_CLIENT_ID" != *.apps.googleusercontent.com ]]; then
            echo "::error::Invalid GOOGLE_WEB_CLIENT_ID format"
            invalid=1
          fi
          if [[ -z "$APPS_SCRIPT_URL" ]]; then
            echo "::error::Missing APPS_SCRIPT_URL GitHub Actions secret"
            invalid=1
          elif [[ "$APPS_SCRIPT_URL" != https://script.google.com/macros/s/*/exec ]]; then
            echo "::error::Invalid APPS_SCRIPT_URL format"
            invalid=1
          fi
          if (( invalid )); then
            echo "❌ BLOCKED: Required OAuth/API configuration is missing or invalid. No APK will be built." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✅ Required configuration is present and correctly formatted (runtime functionality still requires testing)." >> "$GITHUB_STEP_SUMMARY"
      - name: Build test-only debug APK
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: |
          flutter build apk --debug \
            --dart-define="GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID" \
            --dart-define="APPS_SCRIPT_URL=$APPS_SCRIPT_URL"
      - name: Inspect APK and extract signing SHA-1
        shell: bash
        run: |
          APK=build/app/outputs/flutter-apk/app-debug.apk
          test -s "$APK"
          echo "### APK compilation succeeded (runtime login not verified)" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK size: $(du -h "$APK" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "Stable signing keystore was verified before compilation." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: budowa-group-test-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
      - name: Report failure
        if: failure()
        run: |
          echo "### Build failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Open the failed step in the build job to see the exact error." >> "$GITHUB_STEP_SUMMARY"
