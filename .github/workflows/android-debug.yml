name: Android debug APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/android-debug.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android scaffold
        run: flutter create --platforms=android --project-name budowa_group --org group.budowa .
      - name: Remove incompatible generated template files
        run: |
          rm -f test/widget_test.dart
          rm -f analysis_options.yaml
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Build test-only debug APK
        run: flutter build apk --debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: budowa-group-test-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
