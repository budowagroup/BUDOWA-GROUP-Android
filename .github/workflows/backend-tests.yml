name: TEST Apps Script backend checks
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run backend regression tests (no Google Sheets writes)
        run: |
          node backend/tests.js
          node backend/write-tests.js
