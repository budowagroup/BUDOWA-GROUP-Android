name: budowa_group
description: BUDOWA GROUP Android TEST employee-hours and finance app
publish_to: none
version: 0.3.3+8
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  google_sign_in: ^6.2.2
  http: ^1.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/images/background.webp
    - assets/images/splash_screen.webp
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/ic_launcher.png
  adaptive_icon_background: "#0756A3"
  adaptive_icon_foreground: assets/images/ic_launcher.png
